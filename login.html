<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login - Enterprise Operations Dashboard</title>
    <link rel="stylesheet" href="auth.css" />
    <script src="dashboard-data.js"></script>
    <script src="auth.js" defer></script>
  </head>
  <body class="login-page">
    <main class="auth-shell login-shell">
      <section class="login-card" aria-labelledby="loginTitle">
        <aside class="login-visual" aria-label="Operations hub workspace preview">
          <img src="log/log in.png" alt="" aria-hidden="true" />
        </aside>

        <div class="auth-panel login-panel">
          <div class="dot-grid" aria-hidden="true"></div>
          <p class="eyebrow">Operations Hub</p>
          <h1 id="loginTitle">Welcome back</h1>
          <p class="auth-copy">Sign in to continue to your dashboard and keep the day moving.</p>

          <form class="auth-form" data-auth-form="login" novalidate>
            <label>
              <span>Email</span>
              <span class="input-shell">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <path d="m3.7 7.2 8.3 6.1 8.3-6.1"></path>
                </svg>
                <input name="email" type="email" autocomplete="email" placeholder="name@gmail.com" required />
              </span>
              <small class="field-error" data-error-for="email"></small>
            </label>

            <label class="password-field">
              <span>Password</span>
              <span class="input-shell">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>
                <input
                  id="loginPassword"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  value=""
                  required
                />
                <button
                  class="toggle-password"
                  type="button"
                  data-toggle-password="loginPassword"
                  aria-label="Show password"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <span>Show</span>
                </button>
              </span>
              <small class="field-error" data-error-for="password"></small>
            </label>

            <div class="login-options">
              <label class="remember-row">
                <input name="remember" type="checkbox" checked />
                <span>Keep me signed in</span>
              </label>
              <button class="text-link" type="button" data-open-reset="resetPassword">Reset password</button>
            </div>

            <button class="submit-button" type="submit">
              <span class="button-text">Log in</span>
            </button>
            <p class="message" data-form-message role="status"></p>
          </form>

          <section class="reset-panel" id="resetPassword" hidden>
            <form class="reset-form" data-reset-form novalidate>
              <label>
                <span>Email</span>
                <input name="resetEmail" type="email" autocomplete="email" placeholder="name@gmail.com" required />
                <small class="field-error" data-error-for="resetEmail"></small>
              </label>
              <button class="submit-button submit-button--secondary" type="submit">
                <span class="button-text">Send reset link</span>
              </button>
              <p class="message" data-form-message role="status"></p>
            </form>
          </section>

          <p class="auth-footer">New here? <a href="signup.html">Create an account</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
