<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Enterprise Operations Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="dashboard-data.js"></script>
    <script src="admin.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>Dashboard Admin</h1>
        </div>
        <div class="topbar__meta">
          <span id="adminStatus">Admin mode</span>
          <a class="button button--ghost" href="index.html">Back</a>
        </div>
      </header>

      <main>
        <section class="metric-grid" id="adminMetricGrid" aria-label="Admin metrics"></section>

        <section class="dashboard-grid">
          <article class="panel panel--wide">
            <div class="panel__header">
              <div>
                <p class="eyebrow">Employees</p>
                <h2>Employee Database</h2>
              </div>
              <span class="panel__stat" id="adminEmployeeCount"></span>
            </div>
            <div class="rank-list" id="adminDepartmentList"></div>
          </article>

          <article class="panel">
            <div class="panel__header">
              <div>
                <p class="eyebrow">Tools</p>
                <h2>Admin Actions</h2>
              </div>
            </div>
            <div class="stack-list">
              <a class="button" href="index.html#employeesSection">Add Employee</a>
              <a class="button button--ghost" href="index.html">Dashboard</a>
            </div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
